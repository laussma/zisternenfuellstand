name: Firmware Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Support
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile Sketch
        run: |
          mkdir -p ./sketch/Zisternenfuellstand
          cp Zisternenfuellstand.ino ./sketch/Zisternenfuellstand/
          arduino-cli compile \
            --fqbn esp32:esp32:nodemcu-32s \
            --output-dir ./build \
            ./sketch/Zisternenfuellstand

      - name: Prepare release artifacts
        run: |
          cp ./build/Zisternenfuellstand.ino.bin ./build/firmware.bin
          # version.txt enthält nur die Versionsnummer – wird vom Gerät zum Versionsvergleich genutzt
          grep '#define FW_VERSION' Zisternenfuellstand.ino \
            | sed 's/.*FW_VERSION "\(.*\)"/\1/' > ./build/version.txt
          echo "Firmware version: $(cat ./build/version.txt)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ./build/firmware.bin
            ./build/version.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zisternenfüllstand ${{ github.ref_name }}"
          body: |
            ## Firmware ${{ github.ref_name }}

            ### Automatisches Update
            Wenn **Auto-Update** im Gerät aktiviert ist, wird die neue Firmware
            innerhalb einer Stunde automatisch eingespielt.

            ### Manuelles Update via Browser
            1. `firmware.bin` herunterladen
            2. `http://zisterne.local/update` öffnen
            3. Datei auswählen → **Hochladen & Flashen**
            4. Gerät startet automatisch neu

            ### Update via Arduino IDE
            Gerät muss im gleichen WLAN erreichbar sein (Port: `zisterne`).
          files: |
            ./build/firmware.bin
            ./build/version.txt
          draft: false
          prerelease: false
